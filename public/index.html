<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The Modern HEKA Calendar - A 13-month calendar system from April to March" />
  <meta name="theme-color" content="#0c0c0f" />
  
  <title>The Modern HEKA Calendar</title>
  
  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  
  <style>
    /* Critical CSS for initial render */
    html {
      background-color: #0c0c0f;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #root {
      min-height: 100vh;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #f5f5f5;
      background: #0c0c0f;
    }
    .loading::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #caa24a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">Loading HEKA Calendar</div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
