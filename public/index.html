<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta id="heka-viewport" name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    /* ═══════════════════════════════════════════════════════════════════════
       HEKA Viewport Scale Guard — Narrow-Phone Safety Net
       ─────────────────────────────────────────────────────────────────────
       Purpose:
         On large modern phones (Pixel 10 Pro XL, iPhone 15+, etc.) the app
         renders natively — unchanged, unscaled, exactly as designed.
       
         On narrower screens (iPhone SE, budget Androids, small foldables
         folded, etc.) the viewport renders at a 390px baseline and scales
         down proportionally. This guarantees the exact same layout, the
         exact same proportions, the exact same spacing — just slightly
         smaller — with NOTHING cut off.
       
       Why 390px?
         It is just below the width of every modern flagship (412–480px)
         but safely above the narrowest phones still in active use (360px).
         360px devices scale to ~0.923 — a barely perceptible shrink.
       ───────────────────────────────────────────────────────────────────── */
    (function() {
      var DESIGN_BASELINE = 390;

      function updateViewport() {
        var screenW = window.screen ? (window.screen.width || 0) : 0;
        var innerW  = window.innerWidth || 0;
        var w = Math.min(screenW || Infinity, innerW || Infinity) || DESIGN_BASELINE;

        var vp = document.getElementById('heka-viewport');
        if (!vp) return;

        if (w < DESIGN_BASELINE) {
          var scale = (w / DESIGN_BASELINE).toFixed(3);
          vp.setAttribute('content',
            'width=' + DESIGN_BASELINE + ', initial-scale=' + scale + ', viewport-fit=cover');
        } else {
          vp.setAttribute('content',
            'width=device-width, initial-scale=1.0, viewport-fit=cover');
        }
      }

      updateViewport();

      // Recalculate after orientation changes (foldables, rotation)
      window.addEventListener('orientationchange', function() {
        setTimeout(updateViewport, 150);
      });
    })();
  </script>
  <meta name="description" content="The Modern HEKA Calendar - A 13-month calendar system from April to March" />
  <meta name="theme-color" content="#0c0c0f" />
  
  <title>The Modern HEKA Calendar</title>
  
  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/icon-192.png" />
  
  <style>
    /* Critical CSS for initial render */
    html {
      background-color: #0c0c0f;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #root {
      min-height: 100vh;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #f5f5f5;
      background: #0c0c0f;
    }
    .loading::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #caa24a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="heka-loading" class="loading">Loading HEKA Calendar</div>
  </div>
  <script>
    (function() {
      var LOADING_TEXTS = {
        en: 'Loading HEKA Calendar',
        es: 'Cargando Calendario HEKA',
        fr: 'Chargement du calendrier HEKA',
        de: 'HEKA Kalender wird geladen',
        it: 'Caricamento Calendario HEKA',
        pt: 'Carregando o Calendário HEKA',
        zh: '加载HEKA日历',
        ja: 'HEKAカレンダーを読み込んでいます',
        ko: 'HEKA 캘린더를 불러오는 중',
        ar: 'تحميل تقويم HEKA',
        hi: 'HEKA कैलेंडर लोड हो रहा है',
        ru: 'Загрузка календаря HEKA',
        tr: 'HEKA Takvimi Yükleniyor',
        pl: 'Ładowanie Kalendarza HEKA',
        nl: 'HEKA Agenda laden',
        sv: 'Laddar HEKA Kalender',
        el: 'Φόρτωση ΗΜΕΡΟΛΟΓΙΟΥ HEKA',
        he: 'טוען לוח שנה של HEKA',
        th: 'โหลดปฏิทิน HEKA',
        vi: 'Đang tải lịch HEKA',
        id: 'Memuat Kalender HEKA',
        uk: 'Завантаження календаря HEKA',
        ro: 'Încărcarea Calendarului HEKA',
        cs: 'Načítání kalendáře HEKA',
        hu: 'HEKA Naptár betöltése',
        da: 'Indlæser HEKA Kalender',
        fi: 'Ladataan HEKA-kalenteri',
        no: 'Laster HEKA-kalender',
        sk: 'Načítavanie HEKA kalendára',
        bg: 'Зареждане на HEKA Календар'
      };
      var lang = 'en';
      try {
        var setup = JSON.parse(localStorage.getItem('heka-setup-v1') || '{}');
        if (setup.language) {
          lang = setup.language;
        } else {
          var navLang = (navigator.language || navigator.userLanguage || 'en');
          lang = navLang.split('-')[0];
        }
      } catch (e) { /* ignore */ }
      var text = LOADING_TEXTS[lang] || LOADING_TEXTS.en;
      var el = document.getElementById('heka-loading');
      if (el) el.textContent = text;
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
