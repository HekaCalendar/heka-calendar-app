org.gradle.jvmargs=-Xmx4g
android.useAndroidX=true
org.gradle.daemon=false

# 16KB Page Size Support (Required for Android 15+ / API 35+)
# https://developer.android.com/guide/practices/page-sizes
android.buildFeatures.prefab=true
android.defaults.buildfeatures.prefab=true
android.experimental.enableNewResourceProcessing=true
android.enableR8.fullMode=true

# Enable 16KB ELF alignment for native libraries

# Signing config for release builds
RELEASE_STORE_FILE=heka-calendar.keystore
RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}
RELEASE_KEY_ALIAS=heka
RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}
