apply plugin: 'com.android.application'

android {
    namespace = "com.heka.calendar"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    
    defaultConfig {
        applicationId "com.heka.calendar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 271
        versionName "2.2.23"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        androidResources {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        
        // 16KB Page Size Support - NDK r28+ configuration
        // https://developer.android.com/guide/practices/page-sizes
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }
    
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
    signingConfigs {
        debug {
            storeFile file(System.getenv('USERPROFILE') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Configure from key.properties if it exists
            def propsFile = rootProject.file('key.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Only enforce release keystore when actually building a release APK.
            // During debug builds and Android Studio sync, fall back to debug signing.
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                def isReleaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
                if (isReleaseBuild) {
                    throw new GradleException("Release keystore not configured. Create android/app/key.properties for Play Store builds.")
                }
                signingConfig signingConfigs.debug
                println "Warning: Using debug signing for release build type. Create key.properties for Play Store."
            }
            // Include native debug symbols for Play Console crash de-obfuscation
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    
    // Firebase BoM (Bill of Materials) - manages Firebase versions
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    
    // Firebase Auth
    implementation 'com.google.firebase:firebase-auth'
    
    // Firebase Firestore (for cloud sync)
    implementation 'com.google.firebase:firebase-firestore'
    
    // Firebase Cloud Messaging (for push notifications)
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
