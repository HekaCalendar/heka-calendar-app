<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta id="heka-viewport" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="HEKA Calendar v2.2.1 - The 13-month calendar aligned with celestial rhythms" />
  <meta name="theme-color" content="#0c0c0f" />
  
  <!-- NO CACHE -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <title>HEKA Calendar v2.2.1</title>
  
  <!-- INLINE KILL SWITCH - Cannot be cached separately -->
  <script>
    (function() {
      var VERSION = '2.2.1';
      var KEY = 'heka-v220-loaded';
      
      // Check if we already loaded this version
      if (sessionStorage.getItem(KEY)) {
        return; // Already processed
      }
      
      var storedVersion = localStorage.getItem('heka-version');
      console.log('[KILL] Version check:', storedVersion, '->', VERSION);
      
      if (storedVersion !== VERSION) {
        console.log('[KILL] Clearing caches...');
        
        // Unregister SWs
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        
        // Clear caches
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(n) { caches.delete(n); });
          });
        }
        
        // Update version
        localStorage.setItem('heka-version', VERSION);
        sessionStorage.setItem(KEY, 'true');
        
        // Reload with cache busting
        var url = new URL(window.location.href);
        url.searchParams.set('v', VERSION);
        url.searchParams.set('_cb', Date.now());
        window.location.replace(url.toString());
      } else {
        sessionStorage.setItem(KEY, 'true');
      }
    })();
  </script>
  
  <!-- ═══════════════════════════════════════════════════════════════════════
       HEKA Viewport Scale Guard — Narrow-Phone Safety Net
       ─────────────────────────────────────────────────────────────────────
       Large modern phones (Pixel 10 Pro XL, iPhone 15+, etc.) render the
       app natively — unchanged, unscaled, exactly as designed.
       
       Narrower screens (iPhone SE, budget Androids, small foldables
       folded, etc.) render at a 390px baseline and scale down
       proportionally. Same layout, same proportions, same spacing — just
       slightly smaller. Nothing gets cut off.
       
       390px is just below flagship widths (412–480px) but above the
       narrowest active devices (360px). A 360px phone scales to ~0.923.
       ───────────────────────────────────────────────────────────────────── -->
  <script>
    (function() {
      var DESIGN_BASELINE = 390;

      function updateViewport() {
        var screenW = window.screen ? (window.screen.width || 0) : 0;
        var innerW  = window.innerWidth || 0;
        var w = Math.min(screenW || Infinity, innerW || Infinity) || DESIGN_BASELINE;

        var vp = document.getElementById('heka-viewport');
        if (!vp) return;

        if (w < DESIGN_BASELINE) {
          var scale = (w / DESIGN_BASELINE).toFixed(3);
          vp.setAttribute('content',
            'width=' + DESIGN_BASELINE + ', initial-scale=' + scale + ', viewport-fit=cover');
        } else {
          vp.setAttribute('content',
            'width=device-width, initial-scale=1.0, viewport-fit=cover');
        }
      }

      updateViewport();

      window.addEventListener('orientationchange', function() {
        setTimeout(updateViewport, 150);
      });
    })();
  </script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <!-- Icons -->
  <link rel="icon" type="image/png" href="/icon-192.png" />
  
  <style>
    html, body { 
      background-color: #0c0c0f; 
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #root { min-height: 100vh; }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #f5f5f5;
      background: #0c0c0f;
      flex-direction: column;
      gap: 1rem;
    }
    .loading::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #caa24a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .version-badge {
      position: fixed;
      bottom: 8px;
      right: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      font-family: monospace;
      background: rgba(201, 162, 39, 0.2);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(201, 162, 39, 0.3);
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">HEKA v2.2.1</div>
  </div>

  
  <!-- Android Scroll Fix -->
  <script src="/scroll-fix.js"></script>
  
  <!-- Main script -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
