  <title>HEKA Calendar v2.2.1</title>
  
  <!-- INLINE KILL SWITCH - Cannot be cached separately -->
  <script>
    (function() {
      var VERSION = '2.2.1';
      var KEY = 'heka-v220-loaded';
      
      // Check if we already loaded this version
      if (sessionStorage.getItem(KEY)) {
        return; // Already processed
      }
      
      var storedVersion = localStorage.getItem('heka-version');
      console.log('[KILL] Version check:', storedVersion, '->', VERSION);
      
      if (storedVersion !== VERSION) {
        console.log('[KILL] Clearing caches...');
        
        // Unregister SWs (push subscriptions will be restored on next load)
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        
        // Clear caches
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(n) { caches.delete(n); });
          });
        }
        
        // Update version
        localStorage.setItem('heka-version', VERSION);
        sessionStorage.setItem(KEY, 'true');
        
        // Flag that push subscriptions need to be re-registered after reload
        localStorage.setItem('heka-push-needs-refresh', 'true');
        
        // Reload with cache busting
        var url = new URL(window.location.href);
        url.searchParams.set('v', VERSION);
        url.searchParams.set('_cb', Date.now());
        window.location.replace(url.toString());
      } else {
        sessionStorage.setItem(KEY, 'true');
      }
    })();
  </script>
  
  <!-- ═══════════════════════════════════════════════════════════════════════
       HEKA Viewport Scale Guard — Narrow-Phone Safety Net
       ─────────────────────────────────────────────────────────────────────
       Large modern phones (Pixel 10 Pro XL, iPhone 15+, etc.) render the
       app natively — unchanged, unscaled, exactly as designed.
       
       Narrower screens (iPhone SE, budget Androids, small foldables
       folded, etc.) render at a 390px baseline and scale down
       proportionally. Same layout, same proportions, same spacing — just
       slightly smaller. Nothing gets cut off.
       
       390px is just below flagship widths (412–480px) but above the
       narrowest active devices (360px). A 360px phone scales to ~0.923.
       ───────────────────────────────────────────────────────────────────── -->
  <script>
    (function() {
      var DESIGN_BASELINE = 390;

      function updateViewport() {
        var innerW  = window.innerWidth || 0;
        var innerH  = window.innerHeight || 0;
        // Use the smaller dimension to determine if we're on a small phone.
        // This avoids landscape width (800px+) from disabling the scale.
        var minDim = Math.min(innerW, innerH);

        var vp = document.getElementById('heka-viewport');
        if (!vp) return;

        if (minDim < DESIGN_BASELINE) {
          var scale = (minDim / DESIGN_BASELINE).toFixed(3);
          vp.setAttribute('content',
            'width=' + DESIGN_BASELINE + ', initial-scale=' + scale + ', maximum-scale=' + scale + ', user-scalable=no, viewport-fit=cover');
        } else {
          vp.setAttribute('content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
        }
      }

      updateViewport();

      // Use resize instead of orientationchange — fires reliably on Android WebView
      var resizeTimer;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(updateViewport, 200);
      });
    })();
  </script>
